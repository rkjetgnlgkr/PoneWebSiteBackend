server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pone_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Taipei}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:qwerty789}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pone.website.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 設定
jwt:
  secret: ${JWT_SECRET:pone-website-secret-key-2026-super-long-string-for-security}
  expiration: 86400000  # 24小時 (毫秒)

# 檔案上傳路徑
# UPLOAD_URL_PREFIX 在 Zeabur 生產環境設為管理後台完整 URL，例如：
#   https://pone-backend-xsp.zeabur.app/api/files/
# 這樣 DB 存的就是完整絕對路徑，前台可直接使用，不依賴 BACKEND_URL 設定
upload:
  path: ${UPLOAD_PATH:./uploads/}
  url-prefix: ${UPLOAD_URL_PREFIX:/api/files/}
